<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilkoll PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header class="app-header">
    <h1>🚗 Bilkoll</h1>
  </header>

<!-- Navigationsmeny -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('dashboard', event)">Dashboard</button>
  <button class="tab-btn" onclick="switchTab('input', event)">Mata in</button>
  <button class="tab-btn" onclick="switchTab('history', event)">Historik</button>
</nav>

<main class="container">
  <!-- FLIK 1: DASHBOARD -->
  <div id="tab-dashboard" class="tab-content active">
    <!-- Senaste händelsen -->
    <div class="card" style="margin-bottom: 20px;">
      <h3>Senaste händelsen</h3>
      <div id="latest-event-details" style="margin-top: 10px;">
        <em>Laddar...</em>
      </div>
    </div>

    <!-- Årssammanställning per kategori -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>Årssammanställning</h3>
        <select id="year-select" onchange="renderYearSummary()" style="padding: 4px 8px;">
          <!-- Fylls i dynamiskt med år -->
        </select>
      </div>
      <div id="year-summary-list">
        <!-- Kategorisammanställning hamnar här -->
      </div>
    </div>
  </div>

  <!-- FLIK 2: MATA IN -->
  <div id="tab-input" class="tab-content" style="display: none;">
    <form id="car-form">
      <div class="form-group">
        <label for="datum">Datum</label>
        <input type="date" id="datum" name="datum" required>
      </div>

      <div class="form-group">
        <label for="matarstallning">Mätarställning (km)</label>
        <input type="number" id="matarstallning" name="matarstallning" placeholder="t.ex. 112363" required>
      </div>

      <div class="form-group">
        <label for="kategori">Kategori</label>
        <select id="kategori" name="kategori" required onchange="toggleFuelInput()">
          <option value="Drivmedel">Drivmedel</option>
          <option value="Service">Service</option>
          <option value="Reparation">Reparation</option>
          <option value="Försäkring">Försäkring</option>
          <option value="Skatt">Skatt</option>
          <option value="Bilvård">Bilvård</option>
          <option value="Bildelar">Bildelar</option>
          <option value="Övrigt">Övrigt</option>
        </select>
      </div>

      <div class="form-group" id="liter-group">
        <label for="liter">Liter</label>
        <input type="number" step="0.01" id="liter" name="liter" placeholder="t.ex. 45.5">
      </div>

      <div class="form-group">
        <label id="belopp-label" for="belopp">Pris (kr/l)</label>
        <input type="number" step="0.01" id="belopp" placeholder="t.ex. 16.99" required>
      </div>

      <div class="form-group">
        <label for="anteckning">Anteckning</label>
        <input type="text" id="anteckning" name="anteckning" placeholder="Valfri anteckning">
      </div>

      <!-- KNAPPARNA LIGGER NUVARANDE INNE I FORMULÄRET -->
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button type="submit" id="submit-btn" class="btn-primary" style="flex: 1;">Spara händelse</button>
        <button type="button" id="cancel-btn" class="btn-secondary" onclick="resetForm()" style="display: none; flex: 1; background-color: #64748b; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer;">Avbryt</button>
      </div>
    </form>
  </div>

  <!-- FLIK 3: HISTORIK -->
  <div id="tab-history" class="tab-content" style="display: none;">
    <!-- Diagram 1: kr/liter -->
    <div class="card" style="margin-bottom: 15px; padding: 15px;">
      <h3>Drivmedelspris över tid (kr/L)</h3>
      <div style="position: relative; height: 180px; width: 100%;">
        <canvas id="priceChart"></canvas>
      </div>
    </div>

    <!-- Diagram 2: liter/mil -->
    <div class="card" style="margin-bottom: 20px; padding: 15px;">
      <h3>Förbrukning över tid (L/mil)</h3>
      <div style="position: relative; height: 180px; width: 100%;">
        <canvas id="consumptionChart"></canvas>
      </div>
    </div>

    <!-- Accordion-lista över alla händelser -->
    <h3>Händelsehistorik</h3>
    <div id="history-accordion-list" style="margin-top: 10px;"></div>
  </div>
</main>
  
  <div id="toast" class="toast">Data sparades!</div>

  <script src="app.js"></script>
</body>
</html>
