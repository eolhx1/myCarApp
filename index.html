<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilkoll PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>

  <header class="app-header">
    <h1>🚗 Bilkoll</h1>
  </header>

<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('dashboard', event)">Dashboard</button>
  <button class="tab-btn" onclick="switchTab('input', event)">Mata in</button>
</nav>

  <main class="container">
    <section id="dashboard" class="tab-content active">
      <div class="stats-grid">
	  <div class="stat-card">
		<h3>Totalkostnad</h3>
		<p id="total-cost">0 kr</p>
	  </div>
	  <div class="stat-card">
		<h3>Mätarställning</h3>
		<p id="latest-odo">0 km</p>
	  </div>
	  <div class="stat-card">
		<h3>Senaste tankning</h3>
		<p id="latest-fuel">0 L</p>
	  </div>
	  <div class="stat-card">
		<h3>Förbrukning</h3>
		<p id="fuel-consumption">- L/mil</p>
	  </div>
	</div>

	<div class="section-header">
	  <h2>Senaste händelser</h2>
	  <button id="reset-selection-btn" class="btn-secondary" style="display: none;" onclick="clearSelection()">Visa totalt</button>
	</div>
	<ul id="history-list" class="history-list">
	  <!-- Fylls i dynamiskt från JS -->
</ul>
    </section>

    <section id="input" class="tab-content">
      <form id="car-form" class="card-form">
        <div class="form-group">
          <label for="datum">Datum</label>
          <input type="date" id="datum" required>
        </div>

        <div class="form-group">
          <label for="matarstallning">Mätarställning (km)</label>
          <input type="number" id="matarstallning" placeholder="t.ex. 145000" required>
        </div>

        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" onchange="toggleFuelInput()">
            <option value="Drivmedel">Drivmedel</option>
            <option value="Service">Service / Reparation</option>
            <option value="Försäkring">Försäkring</option>
            <option value="Skatt">Skatt</option>
            <option value="Tvätt">Tvätt / Vård</option>
            <option value="Övrigt">Övrigt</option>
          </select>
        </div>

        <div class="form-group">
          <label for="belopp">Belopp (kr)</label>
          <input type="number" id="belopp" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group" id="liter-group">
          <label for="liter">Antal liter (endast drivmedel)</label>
          <input type="number" id="liter" step="0.01" placeholder="0.00">
        </div>

        <div class="form-group">
          <label for="anteckning">Anteckning</label>
          <input type="text" id="anteckning" placeholder="Valfri notering">
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Spara händelse</button>
      </form>
    </section>
  </main>
  
  

  <script src="app.js"></script>
</body>
</html>
