<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilkoll PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
</head>
<body>

  <header class="app-header">
    <h1>🚗 Bilkoll</h1>
  </header>

<!-- Navigationsmeny -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('dashboard', event)">Dashboard</button>
  <button class="tab-btn" onclick="switchTab('input', event)">Mata in</button>
  <button class="tab-btn" onclick="switchTab('history', event)">Historik</button>
</nav>

<main class="container">
  <!-- FLIK 1: DASHBOARD -->
  <div id="tab-dashboard" class="tab-content active">
    <!-- Dina 4 summeringskort -->
    <div class="cards-grid">
      <div class="card">
        <h3 id="card-title-1">Totalkostnad</h3>
        <div id="total-cost" class="card-value">0 kr</div>
      </div>
      <div class="card">
        <h3 id="card-title-2">Mätarställning</h3>
        <div id="latest-odo" class="card-value">0 km</div>
      </div>
      <div class="card">
        <h3 id="card-title-3">Senaste tankning</h3>
        <div id="latest-fuel" class="card-value">0 L</div>
      </div>
      <div class="card">
        <h3 id="card-title-4">Förbrukning</h3>
        <div id="fuel-consumption" class="card-value">- L/mil</div>
      </div>
    </div>

    <!-- Diagram för drivmedelspris -->
    <div class="card" style="margin-top: 20px; padding: 15px;">
      <h3>Drivmedelspris över tid</h3>
      <div style="position: relative; height: 220px; width: 100%;">
        <canvas id="priceChart"></canvas>
      </div>
    </div>
  </div>

  <!-- FLIK 2: MATA IN -->
  <div id="tab-input" class="tab-content" style="display: none;">
    <!-- Ditt befintliga inmatningsformulär -->
  </div>

  <!-- FLIK 3: HISTORIK -->
  <div id="tab-history" class="tab-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2>Händelsehistorik</h2>
      <button id="reset-selection-btn" style="display: none;" onclick="clearSelection()">Visa totalt</button>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </div>
</main>
  
  

  <script src="app.js"></script>
</body>
</html>
